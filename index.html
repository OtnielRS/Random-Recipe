<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- ================= LOGIN VIEW ================= -->
  <div class="view active" id="loginView">
    <header>
      <div>
        <span class="brand-eyebrow">Dapur Digital!</span><br>
        <span class="brand-title">Buku Resep Acak</span>
      </div>
      <div class="header-note">
        Website ini adalah solusi yang tepat untuk kamu yang suka bingung ingin masak apa hari ini!
      </div>
    </header>

    <main id="loginMain">
      <form class="login-card" id="loginForm" novalidate>
        <div class="pin"></div>
        <h1 class="page-title">Halaman Login</h1>
        <div class="title-rule"></div>

        <div class="field" id="namaField">
          <label for="nama">Nama</label>
          <input type="text" id="nama" placeholder="Masukkan Nama">
          <div class="error-msg">Nama tidak boleh kosong.</div>
        </div>

        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Masukkan Email">
          <div class="error-msg">Masukkan email yang valid.</div>
        </div>

        <button type="submit" class="submit">Masuk</button>
        <div class="hint">tenang, data ini cuma disimpan di browser kamu kok 🍳</div>
      </form>
    </main>
  </div>

  <script src="script/randomReciep.js"></script>
  <script src="script/script_random_recipe.js"></script>
  <script src="script/script-login.js"></script>
</body>

</html>
