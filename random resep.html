<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Resep</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header>
        <div>
            <span class="brand-eyebrow">Dapur Digital!</span><br>
            <span class="brand-title">Buku Resep Acak</span>
        </div>
        <div class="header-note">
            Bingung mau masak apa? Kocok halaman ini dan biarkan resep berikut yang menentukan pilihanmu!
        </div>
    </header>
    <!-- Random Page -->
    <div id="second-page">
        <div class="container my-5">
            <div class="p-5 text-center bg-body-tertiary rounded-3">
                <h1 id="entry" class="text-body-emphasis">Dashboard</h1>
            </div>
        </div>
        <button id="random-btn">Random the Recipe!</button>
        <br>
        <br>
        <div id="text-random">
            <h2 class="nama-resep">Nama Resep</h2>
            <div class="list">
                <div class="daftar">
                    <h3>List Bahan</h3>
                    <ol id="bahan">

                    </ol>
                </div>
                <div class="daftar cara">
                    <h3>Cara masak</h3>
                    <ol id="cara">

                    </ol>
                </div>
            </div>
        </div>

        <br>
        <br>
        <br>

        <!-- Video -->
        <div id="iFrameVideo">
            
        </div>
        <br>
        <br>
        <br>
        <!-- History -->
        <div id="riwayat">
            <h2>History</h2>

        </div>



        <div class="list">
            <ol id="history">

            </ol>
        </div>

        <button id="remove-btn">Hapus History</button>
        <button id="logout">Log Out</button>
        <script src="./script/randomReciep.js"></script>
        <script src="./script/script_random_recipe.js"></script>
</body>

</html>
